[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-jax"
dynamic = ["version"]
description = "VULCAN-JAX: JAX-accelerated photochemical kinetics for exoplanet atmospheres"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "jax>=0.4.31",
    "numpy>=1.24",
    "scipy>=1.12",  # lgmres(rtol=...) for the reverse-mode steady-state adjoint
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist>=3",
    "ruff>=0.11",
    "vulture>=2.11",
    "build>=1.2",
    "twine>=5",
    "sympy>=1.12",  # only to run the VULCAN-master oracle tests (master's SymPy chem_funs codegen)
]
plot = [
    "matplotlib>=3.7",
    "Pillow>=10",
]

[project.scripts]
vulcan-jax = "vulcan_jax.vulcan_jax_cli:cli_main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulcan_jax = [
    "atm/**/*",
    "thermo/**/*",
    "fastchem_vulcan/**/*",
    "cfg_examples/**/*.py",
]

[tool.setuptools.exclude-package-data]
vulcan_jax = [
    "**/__pycache__/**",
    "**/*.pyc",
    "fastchem_vulcan/fastchem",
    "fastchem_vulcan/obj/*.o",
    "fastchem_vulcan/obj/*.d",
    "fastchem_vulcan/input/parameters.dat",
    "fastchem_vulcan/input/element_abundances_vulcan.dat",
    "fastchem_vulcan/input/vulcan_TP/vulcan_TP.dat",
    "fastchem_vulcan/output/monitor_output.dat",
    "fastchem_vulcan/output/chem_species.dat",
    "fastchem_vulcan/output/vulcan_EQ.dat",
]

[tool.setuptools.dynamic]
version = { attr = "vulcan_jax._version.__version__" }

# These modules intentionally set up sys.path / os.chdir (so vulcan_cfg's
# relative paths resolve, or to stage VULCAN-master) before importing, so the
# module-level imports legitimately come after executable statements (E402).
[tool.ruff.lint.per-file-ignores]
"examples/grad_reverse_example.py" = ["E402"]
"examples/grad_jvp_example.py" = ["E402"]
"examples/grad_physical_example.py" = ["E402"]
"tests/test_atm_jax.py" = ["E402"]
"examples/quickstart.ipynb" = ["E402"]
"tests/test_atom_conservation_projection.py" = ["E402"]
"tests/test_block_thomas.py" = ["E402"]
"tests/test_block_thomas_diag.py" = ["E402"]
"tests/test_chem_rhs_codegen.py" = ["E402"]
"tests/test_default_master_parity.py" = ["E402"]
"tests/test_oracle.py" = ["E402"]
"tests/test_photo_ion.py" = ["E402"]
"tests/test_steady_state_reaction_sensitivity.py" = ["E402"]
"tests/test_w39b_fastchem_invariant.py" = ["E402"]
"src/vulcan_jax/vulcan_jax_cli.py" = ["E402"]
