name: oracle

# The upstream-comparison suite, run against a REAL pinned checkout of
# exoclime/VULCAN. Separate from `tests.yml` because it is slow and needs an
# upstream clone, from which the tests compile upstream's own FastChem (its EQ
# initializer, which the agreement test compares this port's Gibbs seed
# against; tests/oracle.py). It also runs test_solver_fast.py, whose
# real-block cases need the fixtures built below.
#
# VULCAN_JAX_REQUIRE_ORACLE=1 is the point of this workflow: it turns a
# missing or wrong-revision oracle into a FAILURE instead of a skip. Without
# it a broken clone step would look green (skipped != passed).

on:
  workflow_dispatch:        # release gate: run it deliberately before tagging
  schedule:
    - cron: "17 5 * * 1"    # and weekly, against the pinned revisions

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - family: vulcan2_ncho
            commit: 80f75b9bf243a5a8db55eb04a5806269f56125e7
            select: >-
              tests/test_chem.py tests/test_chem_rhs_codegen.py
              tests/test_default_master_parity.py tests/test_diffusion.py
              tests/test_diffusion_variants.py tests/test_eq_seed.py
              tests/test_gibbs.py
              tests/test_ini_abun.py
              tests/test_oracle_pinning.py tests/test_outer_loop_atm_refresh.py
              tests/test_photo.py tests/test_rates.py tests/test_ros2_step.py
              tests/test_photo_setup.py tests/test_stage_repair_guard.py
              tests/test_solver_fast.py

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Same pin as tests.yml: the version the suite's tolerances are
      # calibrated against.
      # exogibbs pinned and installed with --no-deps: of its declared deps the
      # gas-equilibrium path only needs pandas (exogibbs.io.load_data), which
      # is installed explicitly here; pyfastchem/xarray/thermochem are for
      # parts this package never touches and pyfastchem has no linux-aarch64
      # wheel (the GPU node installs this way). pip still resolves them from
      # the `exogibbs` requirement in pyproject on this x86_64 runner, where
      # they are merely wasted download.
      - name: Install
        run: |
          python -m pip install --no-deps "exogibbs==0.6.0"
          python -m pip install pandas
          python -m pip install -e ".[dev,plot]" "jax==0.6.2"

      # One family runs today (vulcan2_ncho; vulcan2_fastchem_ps_order is kept
      # in science_sources.yaml for provenance only). A directory per family
      # keeps a second family, if one returns, from seeing this one's revision. require_oracle checks the exact commit AND a
      # clean worktree, so a dirty or wrong clone fails loudly here.
      - name: Clone the pinned upstream oracle
        run: |
          git clone --quiet https://github.com/exoclime/VULCAN "$RUNNER_TEMP/oracle-${{ matrix.family }}"
          git -C "$RUNNER_TEMP/oracle-${{ matrix.family }}" checkout --quiet ${{ matrix.commit }}
          test -z "$(git -C "$RUNNER_TEMP/oracle-${{ matrix.family }}" status --porcelain)"

      # The four .npz oracles are gitignored and conftest.py fails collection
      # when one is missing, so the release gate GENERATES them instead of
      # setting VULCAN_JAX_ALLOW_MISSING_FIXTURES: that switch is the developer
      # escape hatch and conftest.py says release CI must not set it (a skipped
      # numerical oracle still reports green). No sibling checkout is needed.
      - name: Build the numerical-regression fixtures
        run: python tests/gen_fixtures.py --all

      # test_chem_rhs_codegen.py's two HD209 projection cases read a CONVERGED
      # HD209 state from output/HD209.vul (or a sibling jax_paper checkout,
      # which CI does not have) and fail without it, since the release gate may
      # not take the ALLOW_MISSING_FIXTURES skip. Converge it here instead: the
      # CLI writes output/<out_name> relative to the cwd, so running from the
      # checkout puts it exactly where the test looks. 1211 steps, ~45 s on the
      # reference laptop plus a cold XLA compile; ncho only (a second family
      # does not select that file).
      - name: Converge HD209 (the codegen tests' steady-state oracle)
        if: matrix.family == 'vulcan2_ncho'
        run: python -m vulcan_jax.vulcan_jax_cli --config HD209

      - name: Run the ${{ matrix.family }} comparisons
        env:
          VULCAN_MASTER_DIR: ${{ runner.temp }}/oracle-${{ matrix.family }}
          VULCAN_JAX_REQUIRE_ORACLE: "1"
        run: python -m pytest ${{ matrix.select }} -q --tb=short -ra

      # The oracle must come back byte-clean: upstream setup rewrites files in
      # place (make_chem_funs renumbers a network file, its FastChem build
      # writes into fastchem_vulcan/), which is why every test works on a COPY.
      # oracle_worktree asserts this per test; this is the end-to-end check.
      - name: The oracle checkout must be unchanged
        run: |
          cd "$RUNNER_TEMP/oracle-${{ matrix.family }}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "The oracle checkout was MUTATED by the test run:"
            git status --porcelain
            exit 1
          fi
