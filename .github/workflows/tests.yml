name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,plot]"
      # The master-oracle comparison tests skip on their own (no ../VULCAN-master
      # here). The NH3 batched-condensation subprocess test takes ~10 minutes on
      # a laptop and longer on this runner, so it stays a local-only test.
      - name: Run tests
        run: python -m pytest tests -n auto -q --tb=short -ra --deselect tests/test_nh3_conden_batch_subprocess.py
