name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # jax pinned to the version the tolerances are calibrated against (pyproject holds the API floor).
      # exogibbs --no-deps: only pandas is needed (exogibbs.io.load_data);
      # pyfastchem has no linux-aarch64 wheel.
      - name: Install
        run: |
          python -m pip install --no-deps "exogibbs==0.6.0"
          python -m pip install pandas
          python -m pip install -e ".[dev,plot]" "jax==0.6.2"
      - name: Show resolved versions
        run: python -c "import jax, numpy, scipy, vulcan_jax; print('jax', jax.__version__, '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| vulcan_jax', vulcan_jax.__version__)"
      # The master-oracle tests skip here ($VULCAN_MASTER_DIR is unset); the
      # release gate oracle.yml runs them against the pinned upstream clone.
      # ALLOW_MISSING_FIXTURES: the .npz fixtures are gitignored; their cases skip.
      - name: Run tests
        env:
          VULCAN_JAX_ALLOW_MISSING_FIXTURES: "1"
        # Three workers: four exceed the 16 GB runner.
        # Deselected, one reason each:
        #   test_nh3_conden_batch_subprocess: ~10 min, a local-only test.
        #   test_forward_jvp_physical: its one-step FD probe swings with CPU/XLA
        #     past the 30% bound (test_forward_jvp_integration is the FD gate).
        #   test_tangent_certificate: +8.3 / +5.7 GB of its own.
        #   the two test_atm_setup_matrix cases: ~8 and ~4 min (expn on the grid).
        #   the queue-vs-batch jvp pin in test_run_queue: 6.4 GB peak, ~2 min.
        run: >-
          python -m pytest tests -n 3 -q --tb=short -ra --durations=15
          --deselect tests/test_nh3_conden_batch_subprocess.py
          --deselect tests/test_forward_jvp_physical.py
          --deselect tests/test_tangent_certificate.py
          --deselect tests/test_run_queue.py::test_queue_jvp_without_refill_is_the_batch_jvp
          --deselect tests/test_atm_setup_matrix.py::test_TP_H14_matches_scipy_reference
          --deselect "tests/test_atm_setup_matrix.py::test_load_TPK_atm_types[analytical-1000000000.0-0.01-50-2140.0]"
