# VULCAN-JAX configuration (default).
# Authored surface: edit values here (or a CWD ./configs/default.yaml override).
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = runtime*1e-5, photo_switch_longdy_thresh = yconv_min*10,
#   para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).

atom_list:
- H
- O
- C
- N
network: thermo/NCHO_photo_network.txt
use_lowT_limit_rates: false
gibbs_text: thermo/gibbs_text.txt
cross_folder: thermo/photo_cross/
com_file: thermo/all_compose.txt
atm_file: atm/atm_HD189_Kzz.txt
sflux_file: atm/stellar_flux/sflux-HD189_Moses11.txt
top_BC_flux_file: null  # set when use_topflux is on (see atm/BC_top_*.txt)
bot_BC_flux_file: null  # set when use_botflux/use_fix_sp_bot is on (see atm/BC_bot_*.txt)
vul_ini: output/HD189-nominal.vul
output_dir: output/
plot_dir: plot/
movie_dir: plot/movie/
out_name: HD189.vul
# EQ takes the selected abundance file unchanged; the *_H values
# below are inactive unless the initialization mode/settings change.
use_solar: true
O_H: 0.00060618
C_H: 0.00027761
N_H: 8.1853e-05
# EQ ignores S_H when S is absent from atom_list.
S_H: 1.3183e-05
# EQ ignores He_H for the shipped atom_list; const_lowT reads it.
He_H: 0.09692
ini_mix: EQ
# Elemental abundances the equilibrium seed starts from. Two files ship:
#   solar_element_abundances.dat            rocky elements suppressed to -3.0,
#                                           hybrid C/N/O (2009), He/S (2019).
#                                           The default, intended
#                                           for the C-H-N-O and S-C-H-N-O
#                                           networks, which have no Mg/Si/Fe
#                                           species to hold the oxygen.
#   solar_element_abundances_lodders2009.dat every element at solar, Lodders
#                                           2009. What upstream VULCAN ships.
#                                           Its C/N/O rows equal the default's,
#                                           so the seed sees only a different
#                                           helium: it does NOT reproduce
#                                           upstream's rocky-oxide oxygen sink
#                                           (0.166 dex on H2O/CH4/CO2 --
#                                           no NCHO/SNCHO species can hold
#                                           that oxygen). See notes.md 2.9.
# The two disagree by ~20% median on HD 189733 b, so MATCH THIS FILE before
# quoting any VULCAN-JAX vs VULCAN 2.0 number.
fastchem_solar_abundance_file: thermo/solar_element_abundances.dat
const_mix:
  CH4: 0.00055522
  O2: 0.0004807
  He: 0.09691
  N2: 8.1853e-05
  H2: 0.99888956
use_photo: true
r_star: 0.805
Rp: 8135789599.999999
# Mp chosen so G*Mp/Rp^2 reproduces the adopted HD189 gs = 2140 cm/s^2 to
# sub-ULP (same value as HD189.yaml). The raw literature mass 2.1220758e30
# gives 2139.77 (-1.07e-4 rel), which measurably shifts photolysis rates
# (up to ~7% per-layer J) and upper-layer radicals (~2.6e-3 in 20 steps).
Mp: 2.1223033871582308e+30
orbit_radius: 0.03142
sl_angle: 0.8377573333333332
f_diurnal: 1.0
scat_sp:
- H2
- He
T_cross_sp: []
edd: 0.5
dbin1: 0.1
dbin2: 2.0
dbin_12trans: 240.0
ini_update_photo_frq: 100
final_update_photo_frq: 5
use_ion: false
atm_base: H2
rocky: false
nz: 150
P_b: 1000000000.0
P_t: 0.01
use_Kzz: true
use_moldiff: true
use_vm_mol: false
use_hybrid_vm_mol: false
use_vz: false
high_temp_cut: false
high_temp_cut_K: 3500.0
high_temp_cut_P: 1000000.0
atm_type: file
Kzz_prof: file
K_max: 100000.0
K_p_lev: 0.1
K_deep: 0.0  # Kzz_prof JM16 only: deep Kzz floor (cm^2/s); 0 = no floor
vz_prof: const
Tiso: 1000
para_warm:
- 120.0
- 1500.0
- 0.1
- 0.02
- 1.0
- 1.0
const_Kzz: 10000000000.0
const_vz: 0
update_frq: 100
use_topflux: false
use_botflux: false
use_fix_sp_bot: {}
diff_esc: []
max_flux: 10000000000000.0
remove_list: []
use_relax: []
use_condense: false
use_settling: false
start_conden_time: 0
stop_conden_time: 100000.0
condense_sp: []
non_gas_sp: []
r_p:
  H2O_l_s: 0.005
rho_p:
  H2O_l_s: 1
fix_species: []
fix_species_from_coldtrap_lev: true
humidity: 1.0
use_ini_cold_trap: false
use_sat_surfaceH2O: false
st_factor: 0.5
conv_step: 500
ode_solver: Ros2
use_print_prog: true
print_prog_num: 500
dttry: 1.0e-10
trun_min: 100.0
runtime: 1.0e+22
dt_min: 1.0e-14
dt_var_max: 2.0
dt_var_min: 0.5
count_min: 120
count_max: 10000
atol: 0.1
mtol: 1.0e-22
mtol_conv: 1.0e-20
pos_cut: 0
nega_cut: -1.0
loss_eps: 0.1
yconv_cri: 0.01
slope_cri: 0.0001
yconv_min: 0.1
flux_cri: 0.1
flux_atol: 1.0
# Certificate term with no VULCAN 2 counterpart (notes §3.1 C21): on the
# accepted step where the chemistry certificate holds, the geometry is
# refreshed from the current composition and the run may end only if
# mu/g/Hp/dzi/Hpi moved by less than this relative amount. 1e-3 measured
# (notes §1.10): HD209 photo-off ends 3e-3 in log VMR from its cadence-1
# reference (1.56 without the term, 2e-2 at 1e-2); 1e-4 never certifies
# HD189_vulcan3, whose top drifts 0.03-0.3% between candidates.
geom_conv_tol: 1.0e-3
# Certificate term with no VULCAN 2 counterpart (notes §3.1 C23): the run may
# end only if the operator-weighted column of every element is within this
# relative distance of the column it started from: the change of that column
# accumulated per step on the grid in force during the step, normalised by the
# t=0 column, so a geometry refresh (which changes the discrete integral
# without moving an atom) neither adds to the term nor rescales it, and what
# is left is what the solver failed to conserve.
# `loss_eps` bounds the PER-STEP change of the unweighted atom sum,
# so a slow drain passes it (§1.12: a column certified having lost 21% of its
# sulfur). 1e-2 measured (§1.13):
# HD189 2.7e-5, HD209 2.4e-5, W39b 2.9e-7, HD189_vulcan3 2.7e-5, W39b
# photo-off 2.2e-3; the drained columns it must reject are 2.2e-1 and 9.8e-1.
element_budget_tol: 1.0e-2
# VULCAN 2 parity: the HD189 example the oracle tests pin
# (exoclime/VULCAN@80f75b9 cfg_examples/vulcan_cfg_HD189.py:148) ships the
# empty list. That revision's ROOT vulcan_cfg.py:153 -- and current exoclime
# and shami-EEG master, and vm_branch:157 -- ship ['HC3N'], the VULCAN 3 value
# that lives in HD189_vulcan3.yaml. Measured identical on HD189 (below).
#
# A 13-heavy-hydrocarbon list used to sit here, credited to "VULCAN-master
# cfg:149". That attribution was false: the list exists in NO upstream
# repository. It is VULCAN-JAX's own early test list (Shami, 2026-07-14:
# "Usually, I only have HC3N"), and it had been written into the local
# ../VULCAN-master copy, which was then cited as proof it was upstream.
# Measured 2026-07-30, HD189, stall fallback off: [] and ['HC3N'] are
# IDENTICAL (1495 steps, longdy 0.09172, same controlling cell); the
# 13-species list is what produced 1296. Do not restore it to buy a step count.
conver_ignore: []
rtol: 0.2
post_conden_rtol: 0.1
use_adapt_rtol: false
rtol_min: 0.0
rtol_max: 1.0
loss_criteria: 0.0005
adapt_rtol_dec_period: 10
adapt_rtol_inc_period: 1000
adapt_rtol_dec: 0.5
adapt_rtol_inc: 1.25
adapt_rtol_loss_mul: 2.0
adapt_rtol_inc_loss_thresh: 0.0002
# 110 (not 64) so `dt < dt_min` ends a reject chain, as master does — see C11 in
# notes.md (Parity & bug guide). Do not round down.
batch_max_retries: 110
step_size_safety: 0.9
step_size_zero_delta_frac: 0.01
photo_switch_longdydt_thresh: 1.0e-06
# Only read when use_fix_H2He is true: the model time at which the H2/He
# bottom mixing ratios are snapshotted and pinned. Inert otherwise.
hycean_pin_time: 1000000.0
loss_ex: []
# Shared by the EQ Gibbs seed and the const_lowT Newton solve. 450 is 2.1x
# the worst iteration count measured over the prior box (214, an isothermal
# 300 K column); the loop exits on the residual, so headroom costs nothing.
fastchem_newton_tol: 1.0e-12
fastchem_newton_max_iter: 450
use_fix_all_bot: false
use_fix_H2He: false
plot_TP: false
use_live_plot: false
use_live_flux: false
use_plot_end: false
use_plot_evo: false
use_save_movie: false
use_flux_movie: false
plot_height: false
use_PIL: true
live_plot_frq: 10
plot_spec:
- H2O
- H
- CH4
- CO
- CO2
- C2H2
- HCN
- NH3
output_humanread: false
use_shark: false
save_evolution: false
save_evo_frq: 10
