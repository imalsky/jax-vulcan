# VULCAN-JAX configuration (W39b).
# Authored surface: edit values here (or a CWD ./configs/W39b.yaml override).
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = runtime*1e-5, photo_switch_longdy_thresh = yconv_min*10,
#   save_movie_rate = live_plot_frq, para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).

atom_list:
- H
- O
- C
- N
- S
network: thermo/SNCHO_photo_network.txt
use_lowT_limit_rates: false
gibbs_text: thermo/gibbs_text.txt
cross_folder: thermo/photo_cross/
com_file: thermo/all_compose.txt
atm_file: atm/atm_W39b_evening_TP_Kzz.txt
sflux_file: atm/stellar_flux/sflux-W39b_Tsai2023.txt
top_BC_flux_file: null  # set when use_topflux is on (see atm/BC_top_*.txt)
bot_BC_flux_file: null  # set when use_botflux/use_fix_sp_bot is on (see atm/BC_bot_*.txt)
vul_ini: output/W39b-nominal.vul
output_dir: output/
plot_dir: plot/
movie_dir: plot/movie/
out_name: W39b.vul
use_solar: false
# C/N/O/S: Lodders 2020 Table 8 present-day solar (log eps C 8.47, N 7.85,
# O 8.73, S 7.15; arXiv:1912.00844) times 10, the set upstream vulcan_cfg.py
# carries as "Table 8. K.Lodders 2019". He_H 0.0838 (10.924 dex) is the same
# table; on the FastChem path the .dat file's He row supplies it.
O_H: 0.00537
C_H: 0.00295
N_H: 0.000708
S_H: 0.000141
He_H: 0.0838
ini_mix: EQ
fastchem_met_scale: 10.0
# Elemental abundances FastChem starts from. Two files ship:
#   solar_element_abundances.dat            rocky elements suppressed to -3.0,
#                                           Lodders 2019. The default. Correct
#                                           for the C-H-N-O and S-C-H-N-O
#                                           networks, which have no Mg/Si/Fe
#                                           species to hold the oxygen.
#   solar_element_abundances_lodders2009.dat every element at solar, Lodders
#                                           2009. What upstream VULCAN ships.
#                                           Use it to compare against an
#                                           unmodified VULCAN checkout.
# The two disagree by ~20% median on HD 189733 b, so MATCH THIS FILE before
# quoting any VULCAN-JAX vs VULCAN 2.0 number. Matched, the codes agree to
# 3.8e-06.
fastchem_solar_abundance_file: fastchem_vulcan/input/solar_element_abundances.dat
const_mix:
  CH4: 0.0059
  O2: 0.0004807
  He: 0.0838
  N2: 0.000354
  H2: 0.9764
use_photo: true
r_star: 0.932
Rp: 9143826800.0
orbit_radius: 0.04828
sl_angle: 1.4486220555555556
f_diurnal: 1.0
scat_sp:
- H2
- He
T_cross_sp: []
edd: 0.5
dbin1: 0.1
dbin2: 2.0
dbin_12trans: 240.0
ini_update_photo_frq: 5
final_update_photo_frq: 5
use_ion: false
atm_base: H2
rocky: false
nz: 150
P_b: 7600000.0
P_t: 0.1
use_Kzz: true
use_moldiff: true
use_vm_mol: false
use_hybrid_vm_mol: false
use_vz: false
high_temp_cut: false
high_temp_cut_K: 3500.0
high_temp_cut_P: 1000000.0
atm_type: file
Kzz_prof: file
K_max: 100000.0
K_p_lev: 0.1
vz_prof: const
Mp: 5.2864327236450345e+29
Tiso: 1000
para_warm:
- 120.0
- 1500.0
- 0.1
- 0.02
- 1.0
- 1.0
const_Kzz: 10000000000.0
const_vz: 0
update_frq: 100
use_topflux: false
use_botflux: false
use_fix_sp_bot: {}
diff_esc: []
max_flux: 10000000000000.0
remove_list: []
use_relax: []
use_condense: false
use_settling: false
start_conden_time: 0
stop_conden_time: 100000.0
condense_sp: []
non_gas_sp: []
r_p:
  H2O_l_s: 0.005
rho_p:
  H2O_l_s: 1
fix_species: []
fix_species_from_coldtrap_lev: true
humidity: 1.0
use_ini_cold_trap: false
use_sat_surfaceH2O: false
st_factor: 0.5
conv_step: 500
# JAX-ONLY convergence fallback. No counterpart in VULCAN 2.0 master or
# vm_branch, so a VULCAN 2 parity run must keep this false. When false the
# predicate is folded away at trace time (bit-identical to not having it).
# `conv_stall_window` is the lookback and is NOT an off switch: it must be
# >= 1, and a small value makes the fallback fire sooner, not never.
use_conv_stall: false
conv_stall_window: 200
ode_solver: Ros2
use_print_prog: true
print_prog_num: 500
dttry: 1.0e-10
trun_min: 100.0
runtime: 1.0e+22
# null, like every other config. This was 3600.0, a one-hour wall-clock cap.
# Upstream VULCAN has no such knob, so a run that hit it terminated for a reason
# VULCAN 2.0 cannot reproduce, and on slower hardware the same config would stop
# at a different point in the integration. A convenience limit does not belong
# in a configuration labelled VULCAN 2 parity. Set it per run if you need one.
wall_clock_max: null
dt_min: 1.0e-14
dt_var_max: 2.0
dt_var_min: 0.5
count_min: 120
count_max: 30000
atol: 0.1
mtol: 1.0e-22
mtol_conv: 1.0e-20
pos_cut: 0
nega_cut: -1.0
loss_eps: 0.1
yconv_cri: 0.01
slope_cri: 0.0001
yconv_min: 0.1
flux_cri: 0.1
flux_atol: 1.0
# VULCAN 2 parity: the HD189 example the oracle tests pin
# (exoclime/VULCAN@80f75b9 cfg_examples/vulcan_cfg_HD189.py:148) ships the
# empty list. That revision's ROOT vulcan_cfg.py:153 -- and current exoclime
# and shami-EEG master, and vm_branch:157 -- ship ['HC3N'], the VULCAN 3 value
# that lives in HD189_vulcan3.yaml. Measured identical on HD189 (below).
#
# A 13-heavy-hydrocarbon list used to sit here, credited to "VULCAN-master
# cfg:149". That attribution was false: the list exists in NO upstream
# repository. It is VULCAN-JAX's own early test list (Shami, 2026-07-14:
# "Usually, I only have HC3N"), and it had been written into the local
# ../VULCAN-master copy, which was then cited as proof it was upstream.
# Measured 2026-07-30, HD189, stall fallback off: [] and ['HC3N'] are
# IDENTICAL (1495 steps, longdy 0.09172, same controlling cell); the
# 13-species list is what produced 1296. Do not restore it to buy a step count.
conver_ignore: []
rtol: 0.2
post_conden_rtol: 0.1
use_adapt_rtol: false
rtol_min: 0.0
rtol_max: 1.0
loss_criteria: 0.0005
adapt_rtol_dec_period: 10
adapt_rtol_inc_period: 1000
adapt_rtol_dec: 0.5
adapt_rtol_inc: 1.25
adapt_rtol_loss_mul: 2.0
adapt_rtol_inc_loss_thresh: 0.0002
# 110 (not 64) so `dt < dt_min` ends a reject chain, as master does — see C11 in
# notes.md (Parity & bug guide). Do not round down.
batch_max_retries: 110
step_size_safety: 0.9
step_size_zero_delta_frac: 0.01
photo_switch_longdydt_thresh: 1.0e-06
# Only read when use_fix_H2He is true: the model time at which the H2/He
# bottom mixing ratios are snapshotted and pinned. Inert otherwise.
hycean_pin_time: 1000000.0
loss_ex: []
report_column_atom_loss: false
fastchem_newton_tol: 1.0e-12
fastchem_newton_max_iter: 50
use_fix_all_bot: false
use_fix_H2He: false
use_chunked_runner: false
plot_TP: false
use_live_plot: false
use_live_flux: false
use_plot_end: false
use_plot_evo: false
use_save_movie: false
use_flux_movie: false
plot_height: false
use_PIL: false
live_plot_frq: 10
plot_spec:
- H2O
- H
- CH4
- CO
- CO2
- SO2
- H2S
- NH3
output_humanread: false
use_shark: false
save_evolution: false
save_evo_frq: 10
