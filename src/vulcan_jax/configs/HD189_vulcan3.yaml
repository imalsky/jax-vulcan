# VULCAN-JAX configuration -- HD 189733 b, VULCAN 3 preset.
#
# This is the EXPLICIT VULCAN 3 configuration. It is HD189.yaml's physics with
# the numerics of shami-EEG/VULCAN `vm_branch` (fetched 2026-07-30), which is
# the branch VULCAN 3 is being built from. Use HD189.yaml for a VULCAN 2 parity
# run against exoclime/VULCAN `master`; use this one to exercise the VULCAN 3
# feature set.
#
# Every knob below that differs from HD189.yaml is a vm_branch value, cited to
# the fetched file, EXCEPT `use_conv_stall`, which is a VULCAN-JAX-only
# convergence fallback with no upstream counterpart and is flagged as such.
#
# Authored surface: edit values here (or a CWD ./configs/HD189_vulcan3.yaml).
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = runtime*1e-5, photo_switch_longdy_thresh = yconv_min*10,
#   save_movie_rate = live_plot_frq, para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).
atom_list:
- H
- O
- C
- N
network: thermo/NCHO_photo_network.txt
use_lowT_limit_rates: false
gibbs_text: thermo/gibbs_text.txt
cross_folder: thermo/photo_cross/
com_file: thermo/all_compose.txt
atm_file: atm/atm_HD189_Kzz.txt
sflux_file: atm/stellar_flux/sflux-HD189_Moses11.txt
top_BC_flux_file: atm/BC_top.txt
bot_BC_flux_file: atm/BC_bot.txt
vul_ini: output/HD189-nominal.vul
output_dir: output/
plot_dir: plot/
movie_dir: plot/movie/
out_name: HD189_vulcan3.vul
use_solar: true
O_H: 0.00060618
C_H: 0.00027761
N_H: 8.1853e-05
S_H: 1.3183e-05
He_H: 0.09692
ini_mix: EQ
fastchem_met_scale: 1.0
# Elemental abundances FastChem starts from. Two files ship:
#   solar_element_abundances.dat            rocky elements suppressed to -3.0,
#                                           Lodders 2019. The default. Correct
#                                           for the C-H-N-O and S-C-H-N-O
#                                           networks, which have no Mg/Si/Fe
#                                           species to hold the oxygen.
#   solar_element_abundances_lodders2009.dat every element at solar, Lodders
#                                           2009. What upstream VULCAN ships.
#                                           Use it to compare against an
#                                           unmodified VULCAN checkout.
# The two disagree by ~20% median on HD 189733 b, so MATCH THIS FILE before
# quoting any VULCAN-JAX vs VULCAN 2.0 number. Matched, the codes agree to
# 3.8e-06.
fastchem_solar_abundance_file: fastchem_vulcan/input/solar_element_abundances.dat
const_mix:
  CH4: 0.00055522
  O2: 0.0004807
  He: 0.09691
  N2: 8.1853e-05
  H2: 0.99888956
use_photo: true
r_star: 0.805
Rp: 8135789599.999999
orbit_radius: 0.03142
sl_angle: 0.8377573333333332
f_diurnal: 1.0
scat_sp:
- H2
- He
T_cross_sp: []
edd: 0.5
dbin1: 0.1
dbin2: 2.0
dbin_12trans: 240.0
ini_update_photo_frq: 100
final_update_photo_frq: 5
use_ion: false
atm_base: H2
rocky: false
nz: 150
P_b: 1000000000.0
P_t: 0.01
use_Kzz: true
use_moldiff: true
# vm_branch vulcan_cfg.py:147-148 -- upwind molecular diffusion, then the
# in-loop flip to central difference. Phase 0 hands over on convergence,
# runtime, or step count, so a run that stops on the loop's own test is in the
# central phase; it is a central-difference fixed point only when it also
# converged (end_case 1). See README.md (Validation), "Hybrid molecular diffusion".
use_vm_mol: true
use_hybrid_vm_mol: true
use_vz: false
# vm_branch vulcan_cfg.py:149-151. Not a temperature clip: it raises P_b to
# the shallowest deep level cooler than high_temp_cut_K and re-grids.
# Inert on this planet (HD 189733 b never reaches 3500 K); it is set here to
# match vm_branch, NOT because this config validates the feature.
high_temp_cut: true
high_temp_cut_K: 3500.0
high_temp_cut_P: 1000000.0
atm_type: file
Kzz_prof: file
K_max: 100000.0
K_p_lev: 0.1
vz_prof: const
Mp: 2.1223033871582308e+30
Tiso: 1000
para_warm:
- 120.0
- 1500.0
- 0.1
- 0.02
- 1.0
- 1.0
const_Kzz: 10000000000.0
const_vz: 0
update_frq: 100
use_topflux: false
use_botflux: false
use_fix_sp_bot: {}
diff_esc: []
max_flux: 10000000000000.0
remove_list: []
use_relax: []
use_condense: false
use_settling: false
start_conden_time: 0
stop_conden_time: 100000.0
condense_sp: []
non_gas_sp: []
r_p:
  H2O_l_s: 0.005
rho_p:
  H2O_l_s: 1
fix_species: []
fix_species_from_coldtrap_lev: true
humidity: 1.0
use_ini_cold_trap: false
use_sat_surfaceH2O: false
st_factor: 0.5
conv_step: 500
# JAX-ONLY convergence fallback. No counterpart in VULCAN 2.0 master or
# vm_branch, so a VULCAN 2 parity run must keep this false. When false the
# predicate is folded away at trace time (bit-identical to not having it).
# `conv_stall_window` is the lookback and is NOT an off switch: it must be
# >= 1, and a small value makes the fallback fire sooner, not never.
#
# OFF here too, since 2026-07-30. This preset converges on the normal criterion
# at 2820 accepted steps (termination_reason 1), so the fallback never fired
# even when it was enabled. Every other consumer in the workspace was already
# disabling it by hand -- vulcan-jwst-tool/adjoint_diag.py and three
# jax_paper/scripts/adj_*.py set conv_stall_window = 10**9 for exactly that
# purpose. Nothing shipped now decides convergence on a non-VULCAN criterion.
# Set it true deliberately if you want the shortcut; the counters it uses
# (longdy_seen_min, count_since_new_min) stay available as diagnostics either
# way, which is what vulcan-forward and vulcan-retrieval read.
use_conv_stall: false
conv_stall_window: 200
ode_solver: Ros2
use_print_prog: true
print_prog_num: 500
dttry: 1.0e-10
trun_min: 100.0
runtime: 1.0e+22
dt_min: 1.0e-14
dt_var_max: 2.0
dt_var_min: 0.5
count_min: 120
# vm_branch vulcan_cfg.py:121 -- count_max = int(2E4)
count_max: 20000
atol: 0.1
mtol: 1.0e-22
# vm_branch vulcan_cfg.py:124 (master ships 1e-20)
mtol_conv: 1.0e-18
pos_cut: 0
nega_cut: -1.0
loss_eps: 0.1
yconv_cri: 0.01
slope_cri: 0.0001
yconv_min: 0.1
flux_cri: 0.1
flux_atol: 1.0
# shami-EEG/VULCAN vm_branch vulcan_cfg.py:157. Upstream master ships [];
# this single entry is the VULCAN 3 value and matches Shami's own practice
# (2026-07-14: "Usually, I only have HC3N").
conver_ignore:
- HC3N
# vm_branch vulcan_cfg.py:161
rtol: 0.25
post_conden_rtol: 0.1
# vm_branch vulcan_cfg.py:160 + op.py:836-851. Note the ONLY adaptive-rtol
# difference between master and vm_branch is the decrease factor (0.75 ->
# 0.5); the periods and the increase factor are identical in both.
use_adapt_rtol: true
rtol_min: 0.01
rtol_max: 2.5
loss_criteria: 0.0005
adapt_rtol_dec_period: 10
adapt_rtol_inc_period: 1000
adapt_rtol_dec: 0.5
adapt_rtol_inc: 1.25
adapt_rtol_loss_mul: 2.0
adapt_rtol_inc_loss_thresh: 0.0002
# 110 (not 64) so `dt < dt_min` ends a reject chain, as master does — see C11 in
# README.md (Parity & bug guide). Do not round down.
batch_max_retries: 110
step_size_safety: 0.9
step_size_zero_delta_frac: 0.01
use_pi_controller: false
pi_controller_alpha: 0.7
pi_controller_beta: 0.4
photo_switch_longdydt_thresh: 1.0e-06
# Only read when use_fix_H2He is true: the model time at which the H2/He
# bottom mixing ratios are snapshotted and pinned. Inert otherwise.
hycean_pin_time: 1000000.0
loss_ex: []
report_column_atom_loss: false
fastchem_newton_tol: 1.0e-12
fastchem_newton_max_iter: 50
use_fix_all_bot: false
use_fix_H2He: false
use_chunked_runner: false
wall_clock_max: null
plot_TP: false
use_live_plot: false
use_live_flux: false
use_plot_end: false
use_plot_evo: false
use_save_movie: false
use_flux_movie: false
plot_height: false
use_PIL: true
live_plot_frq: 10
y_time_freq: 1
plot_spec:
- H2O
- H
- CH4
- CO
- CO2
- C2H2
- HCN
- NH3
output_humanread: false
use_shark: false
save_evolution: false
save_evo_frq: 10
