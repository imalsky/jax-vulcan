# Science-source manifest: what this release claims to carry, and from where.
#
# WHY THIS FILE EXISTS
# --------------------
# Several oracle tests used to auto-detect `../VULCAN-master/` and compare
# against whatever commit happened to be sitting there. That is not a definition
# of parity -- it is a definition of "whatever is on this laptop". Two concrete
# failures followed:
#
#   * The vendored NCHO network carries `NH3 + CH -> NH2 + CH2`, which upstream
#     DELETED in commit 39f1906. Current public master therefore parses 438
#     forward rows where the vendored file has 439, so every raw reaction index
#     shifts and Gibbs/rate comparisons fail for reasons that have nothing to do
#     with the ported kernels -- a cascade of confusing numerical failures where
#     the honest answer is "unsupported oracle revision".
#   * The local `../VULCAN-master/` copy is not a git checkout at all and was
#     found in 2026-07-30 to contain VULCAN-JAX's OWN stall detector, knobs, and
#     13-species `conver_ignore` list, which had then been cited as proof those
#     were upstream. `tools/audit_master_parity.py` refuses such a tree now
#     (`_check_oracle_is_pristine`), but refusing contamination is not the same
#     as pinning a revision.
#
# So: each oracle-test family names the exact upstream commit it is valid
# against, and the tests verify `git rev-parse HEAD` plus a clean worktree
# BEFORE they compute anything.
#
# WHAT THIS FILE IS NOT
# ---------------------
# Not a cross-version network mapper. If upstream moves, the answer is to pin a
# new revision here deliberately (and re-measure), never to teach the audit to
# translate between reaction numbering schemes.

schema_version: 1

# ---------------------------------------------------------------------------
# Upstream oracle revisions, per test family.
# ---------------------------------------------------------------------------
# `VULCAN_MASTER_DIR` must point at a clean checkout of the named repository at
# EXACTLY the named commit. There is deliberately no default sibling path: an
# arbitrary `../VULCAN-master` is what this manifest exists to stop.
oracles:

  vulcan2_ncho:
    repo: https://github.com/exoclime/VULCAN
    commit: 80f75b9bf243a5a8db55eb04a5806269f56125e7
    why: >-
      The parent of 39f1906, the commit that removed
      `NH3 + CH -> NH2 + CH2` from NCHO_photo_network.txt. The vendored
      VULCAN-JAX network is BYTE-IDENTICAL to this revision's file, so reaction
      positions line up and rate/Gibbs comparisons are meaningful. Any later
      revision shifts every index past that reaction.
    used_by:
      - tests/test_gibbs.py
      - tests/test_chem.py
      - tests/test_chem_rhs_codegen.py
      - tests/test_ros2_step.py
      - tests/test_photo.py
      - tests/test_diffusion.py
      - tests/test_diffusion_variants.py
      - tests/test_ini_abun.py
      - tests/test_network_parse.py
      - tests/test_outer_loop_atm_refresh.py
      - tests/test_rates.py
      - tests/test_default_master_parity.py
      - tests/test_w39b_fastchem_invariant.py

  vulcan2_fastchem_ps_order:
    repo: https://github.com/exoclime/VULCAN
    commit: 897033769d62caa27ee44f7360dcaba1e947919c
    why: >-
      Current public master, kept as the reference for the FastChem P/S
      element-ORDER correction (README.md, Parity & bug guide, C12). Upstream's own 2026-07-28
      "fix" (8970337) is INERT: it edited `fc_list` while the defect is the row
      order of the shipped .dat file, so the report must cite the .dat, not
      fc_list. Upstream has no W39 config, so the invariant test resolves the
      shipped W39b.yaml and stages the checksummed SNCHO network, atmosphere,
      and stellar spectrum listed below into a disposable copy. This revision
      is NOT valid for the NCHO reaction-index families above -- it postdates
      39f1906.
    used_by:
      - tests/test_fastchem_element_order.py

  vulcan3_vm_branch:
    repo: https://github.com/shami-EEG/VULCAN
    branch: vm_branch
    commit: 84d010dce7769d365b3669e7edf9fb649709f706
    why: >-
      The VULCAN 3 source for the ported features below. This is ONE commit
      after 362cfa21901a46133e14e24cd1fc8ab4c0f9565c, the base the port
      originally cited; the intervening change corrects the FastChem
      element-list order. That distinction is scientifically load-bearing and is
      recorded here rather than hidden behind a branch name.
    features_claimed_from_it:
      - "upwind molecular diffusion (use_vm_mol, op.update_mu_dz form)"
      - "hybrid in-loop upwind->central phase flip (use_hybrid_vm_mol)"
      - "high-temperature bottom cut (high_temp_cut*)"
      - "adaptive rtol controller (use_adapt_rtol and its period/step knobs)"
      - "conver_ignore ['HC3N'] as shipped in configs/HD189_vulcan3.yaml"

# ---------------------------------------------------------------------------
# Supported vendored scientific inputs.
