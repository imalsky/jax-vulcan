# Science-source manifest: what this release claims to carry, and from where.
#
# Each oracle-test family names the exact upstream commit it is valid against,
# and the tests verify `git rev-parse HEAD` plus a clean worktree BEFORE they
# compute anything. A checkout at another commit is not a parity reference: the
# vendored NCHO network carries `NH3 + CH -> NH2 + CH2`, which upstream deleted
# in 39f1906, so a later revision shifts every reaction index past it. A tree
# carrying VULCAN-JAX's own code is refused outright
# (`tools/audit_master_parity.py`, `_check_oracle_is_pristine`).
#
# Not a cross-version network mapper: if upstream moves, pin a new revision
# here and re-run the oracle tests.

schema_version: 1

# ---------------------------------------------------------------------------
# Upstream oracle revisions, per test family.
# ---------------------------------------------------------------------------
# `VULCAN_MASTER_DIR` names a clean checkout at the named commit; there is no
# default path. An upstream defect corrected on both sides is a code delta in
# tests/oracle.py::ORACLE_CODE_DELTAS, applied to the disposable copy only
# (see `intentional_divergences`).
oracles:

  vulcan2_ncho:
    repo: https://github.com/exoclime/VULCAN
    commit: 80f75b9bf243a5a8db55eb04a5806269f56125e7
    why: >-
      Parent of 39f1906, which removed `NH3 + CH -> NH2 + CH2` from
      NCHO_photo_network.txt. The vendored network is byte-identical to this
      revision's file, so reaction positions line up; any later revision shifts
      every index past that reaction.
    used_by:
      - tests/test_gibbs.py
      - tests/test_chem.py
      - tests/test_chem_rhs_codegen.py
      - tests/test_ros2_step.py
      - tests/test_photo.py
      - tests/test_diffusion.py
      - tests/test_diffusion_variants.py
      - tests/test_outer_loop_atm_refresh.py
      - tests/test_rates.py
      - tests/test_default_master_parity.py
      - tests/test_eq_seed.py

  vulcan2_fastchem_ps_order:
    repo: https://github.com/exoclime/VULCAN
    commit: 897033769d62caa27ee44f7360dcaba1e947919c
    why: >-
      Last VULCAN 2 master revision; reference for the FastChem P/S
      element-order correction. Its fc_list edit (8970337) leaves the row
      order of the shipped .dat unchanged, so cite the .dat. Not valid for the
      NCHO reaction-index families: it postdates 39f1906.
    used_by: []   # provenance of the two abundance presets below; no test runs it

  vulcan3_vm_branch:
    repo: https://github.com/shami-EEG/VULCAN
    branch: vm_branch
    commit: 84d010dce7769d365b3669e7edf9fb649709f706
    why: >-
      VULCAN 3 source for the features below: one commit after
      362cfa21901a46133e14e24cd1fc8ab4c0f9565c, and that commit corrects the
      FastChem element-list order.
    features_claimed_from_it:
      - "upwind molecular diffusion (use_vm_mol, op.update_mu_dz form)"
      - "hybrid in-loop upwind->central phase flip (use_hybrid_vm_mol)"
      - "high-temperature bottom cut (high_temp_cut*)"
      - "adaptive rtol controller (use_adapt_rtol and its period/step knobs)"
      - "conver_ignore ['HC3N'] as shipped in configs/HD189_vulcan3.yaml"

