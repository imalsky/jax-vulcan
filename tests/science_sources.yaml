# ---------------------------------------------------------------------------
# Intentional divergences from upstream.
# ---------------------------------------------------------------------------
# Exact upstream byte parity is NOT the goal where upstream is known wrong.
# Exact documentation and a test for each deliberate difference IS. Anything
# not listed here that differs is drift, and the audit fails on it.
intentional_divergences:

  C1_ch2cn_falloff:
    files:
      - thermo/SNCHO_photo_network.txt
      - thermo/SNCHO_photo_network_C3.txt
      - thermo/SNCHO_DMS_photo_network_Tsai2024.txt
    reaction: CH2CN + H + M -> CH3CN + M
    reason: >-
      Upstream's own 10.2025 typo fix (k0 = 1.00E-29, k_inf = 1.00E-10) was
      applied to NCHO but left unapplied to the sulfur files: the base SNCHO and
      C3 files ship k0 = 1.00E-20 and the DMS Tsai2024 file ships k0/k_inf
      swapped. VULCAN-JAX corrects all three.
    recorded_in: README.md (Parity & bug guide, C1)

  C4_epseri_flux_rescale:
    files: [atm/stellar_flux/sflux-epseri.txt]
    factor: 0.735**-4
    reason: >-
      Master's builder (atm/make_spectra_in_nm.py) multiplied by R_star where
      the surface-flux conversion divides, so the shipped eps Eri spectrum is
      low by exactly R_star^4.
    recorded_in: README.md (Parity & bug guide, C4)

  C12_fastchem_ps_order:
    files: [fastchem_vulcan/input/solar_element_abundances.dat]
    reason: >-
      Upstream swaps the P and S rows of the element-abundance file relative to
      the element list FastChem reads. CONFIRMED still open at exoclime HEAD
      (introduced 604ca6e). Measured impact on a real W39b column: atomic S
      moves 2.6-3.1 dex; every molecule <= 0.004 dex.
    recorded_in: README.md (Parity & bug guide, C12)

  C15_lodders2019_rocky_suppressed:
    files: [fastchem_vulcan/input/solar_element_abundances.dat]
    reason: >-
      The DEFAULT preset uses Lodders 2019 with rocky elements suppressed to
      -3.0, which is correct for NCHO/SNCHO networks that carry no Mg/Si/Fe
      species to hold the oxygen. Upstream ships Lodders 2009 at solar. This is
      a CONFIG CHOICE, not a correction: both files ship and
      `fastchem_solar_abundance_file` selects.
    recorded_in: README.md (Validation)

  nh3_ice_mass:
    reason: NH3 condensate molar mass correction.
    recorded_in: README.md (Parity & bug guide)

  h2s_units:
    reason: H2S saturation-pressure unit correction.
    recorded_in: README.md (Parity & bug guide)

  controller_defaults:
    reason: >-
      Solver tuning and vm_branch controller defaults differ deliberately; the
      audit ignores them via INTENTIONAL_JAX_DELTAS / JAX_ONLY_DEFAULTS.
    recorded_in: tools/audit_master_parity.py

# ---------------------------------------------------------------------------
# Explicitly NOT in this release.
# ---------------------------------------------------------------------------
# Stated so that an oracle checkout carrying them is recognised as a NEWER
# upstream than this release supports, rather than as a missing-file error. Do
# not copy any of these into the repository to make an audit pass.
not_in_this_release:
  networks:
    - CRAHCNO_V3
    - HNC thermochemistry
    - NCCN thermochemistry
  reason: >-
    Porting the newer network and the new HNC/NCCN thermochemistry is an
    explicit non-goal of the 2026-08 release. Their presence in an oracle
    checkout means that checkout is newer than the pinned revisions above.
