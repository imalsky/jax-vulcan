# `tools/audit_master_parity.py` compares. Whole-tree equality was the previous
# rule and it cannot succeed: current public master ships CRAHCNO_V3 / HNC /
# NCCN files this release does not carry, and the Shami base carries many
# unrelated historical files, so the audit failed on "file set mismatch" before
# comparing anything that matters.
#
# sha256 is of the file as vendored under src/vulcan_jax/.
