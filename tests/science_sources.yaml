# ---------------------------------------------------------------------------
# Intentional divergences from upstream.
# ---------------------------------------------------------------------------
# Each intentional difference from upstream is listed here with a test;
# anything else that differs is drift, and the audit fails on it.
intentional_divergences:

  ch3oh_troe_log10:
    reaction: OH + CH3 + M -> CH3OH + M
    reason: >-
      Upstream op.py:204-205 takes the Troe width and log(Pr) in natural log;
      Visscher & Moses 2011 eq 14 uses log10 (rate 1.19-1.21x high in the
      falloff wings at 1000-1500 K). VULCAN-JAX uses log10, and the same
      two-line correction is applied to the DISPOSABLE oracle copy by
      tests/oracle.py::apply_code_deltas so the 1e-10 rate/Gibbs/step
      comparisons stay 1-1; pinned checkouts are never edited.
    recorded_in: tests/oracle.py::ORACLE_CODE_DELTAS

  renumber_2025_reaction_index_gap:
    files:
      - thermo/SNCHO_photo_network_2025.txt
    reaction: CH3 + C2H2 -> CH2CCH2 + H
    reason: >-
      Upstream numbers this row 1039, breaking the otherwise strictly
      increasing odd-numbered forward-reaction sequence, and then continues
      at 861. VULCAN-JAX renumbers the run from 861 so the indices stay
      monotonic. Stripping the leading index makes the file byte-identical to
      the oracle copy: rates, reactions and references are unchanged.
    recorded_in: tools/audit_master_parity.py::KNOWN_THERMO_RENUMBERED

  ch2cn_falloff:
    files:
      - thermo/SNCHO_photo_network.txt
      - thermo/SNCHO_photo_network_C3.txt
      - thermo/SNCHO_DMS_photo_network_Tsai2024.txt
    reaction: CH2CN + H + M -> CH3CN + M
    reason: >-
      Upstream's own 10.2025 typo fix (k0 = 1.00E-29, k_inf = 1.00E-10) was
      applied to NCHO but left unapplied to the sulfur files: the base SNCHO and
      C3 files ship k0 = 1.00E-20 and the DMS Tsai2024 file ships k0/k_inf
      swapped. VULCAN-JAX corrects all three.
    recorded_in: tools/audit_master_parity.py::KNOWN_THERMO_DIVERGENCES

  epseri_flux_rescale:
    files: [atm/stellar_flux/sflux-epseri.txt]
    factor: 0.735**-4
    reason: >-
      Master's builder (atm/make_spectra_in_nm.py; copy in tools/data_prep/)
      multiplied by R_star where the surface-flux conversion divides, so the
      shipped eps Eri spectrum is low by R_star^4.
    recorded_in: tools/audit_master_parity.py::KNOWN_SFLUX_RESCALES

  gj1214_upstream_regenerated:
    files: [atm/stellar_flux/sflux-GJ1214.txt]
    reason: >-
      The pinned vulcan2_ncho copy pads 133.75-181.55 nm with 464 zero-flux
      rows that bin into the FUV photolysis drive as real zeros.
      Upstream's regeneration (bb9255b1) deletes them and lowers every flux by
      a constant 1.392; the wavelength grid is otherwise identical. The builder
      in tools/data_prep/ (47.5 ly / 0.2064 r_sun) reproduces the
      pre-regeneration normalisation.
    recorded_in: supported_inputs sha256 pin (this file)

  fastchem_ps_order:
    files: [thermo/solar_element_abundances.dat]
    reason: >-
      Upstream swaps the P and S rows of the element-abundance file relative to
      the element list FastChem reads (introduced 604ca6e, open at exoclime
      HEAD). On a W39b column atomic S moves 2.6-3.1 dex, molecules <= 0.004 dex.
    recorded_in: supported_inputs sha256 pin (this file)

  lodders2019_rocky_suppressed:
    files: [thermo/solar_element_abundances.dat]
    reason: >-
      The default hybrid preset keeps upstream C/N/O and uses approximately
      Lodders 2019 He/S, with rocky elements suppressed to -3.0 for NCHO/SNCHO
      networks that carry no Mg/Si/Fe
      species to hold the oxygen. Upstream ships Lodders 2009 at solar. This is
      a config choice, not a correction: both files ship and
      `fastchem_solar_abundance_file` selects.
    recorded_in: fastchem_solar_abundance_file in src/vulcan_jax/configs/*.yaml

  nh3_ice_mass:
    reason: >-
      Upstream thermo/all_compose.txt:167 lists NH3_l_s at 16.023 g/mol
      (NH2's mass); VULCAN-JAX uses 17.031.
    recorded_in: tools/audit_master_parity.py::KNOWN_THERMO_DIVERGENCES

  h2s_units:
    reason: >-
      Upstream build_atm.py:857 converts the cmHg H2S saturation fit with
      0.001333, the mmHg factor (10x low); VULCAN-JAX uses 0.01333.
    recorded_in: src/vulcan_jax/atm_setup.py::_CMHG_TO_BAR

  controller_defaults:
    reason: >-
      Solver tuning and vm_branch controller defaults differ from upstream; the
      audit ignores them via INTENTIONAL_JAX_DELTAS / JAX_ONLY_DEFAULTS.
    recorded_in: tools/audit_master_parity.py

# ---------------------------------------------------------------------------
# Explicitly NOT in this release.
# ---------------------------------------------------------------------------
# An oracle checkout carrying these is newer than this release supports, not
# a missing-file error. Do not copy them in to make an audit pass.
not_in_this_release:
  networks:
    - CRAHCNO_V3
    - HNC thermochemistry
    - NCCN thermochemistry
  reason: >-
    Out of scope for this port; their presence in an oracle checkout means it
    is newer than the pinned revisions above.
