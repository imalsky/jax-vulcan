[pytest]
# `pytest -n auto` is safe: the EQ seed is in-process JAX, so concurrent
# workers share no scratch files.
testpaths = tests
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: heavy tests (e.g. the reverse-mode HD189 adjoint regression); skipped
        unless VULCAN_JAX_RUN_SLOW=1
    strict_isolation: restore vulcan_cfg + clear JAX caches around the test
addopts = -ra --tb=short
